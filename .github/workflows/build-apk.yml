name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Web Assets & Compile Signed APK
        run: |
          set -e
          ASSETS_DIR="android-app/app/src/main/assets"
          mkdir -p "$ASSETS_DIR"
          cp index.html style.css app.js manifest.json icon.svg sw.js "$ASSETS_DIR/"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          PLATFORM=$(ls -d "$ANDROID_HOME/platforms/"* | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS"
          echo "Using platform: $PLATFORM"

          WORK_DIR="build_fast"
          mkdir -p "$WORK_DIR/classes"

          "$BUILD_TOOLS/aapt2" link \
            -o "$WORK_DIR/unaligned.apk" \
            -I "$PLATFORM/android.jar" \
            --manifest "android-app/app/src/main/AndroidManifest.xml" \
            -A "$ASSETS_DIR" \
            --auto-add-overlay

          javac --release 8 -encoding UTF-8 \
            -cp "$PLATFORM/android.jar" \
            -d "$WORK_DIR/classes" \
            "android-app/app/src/main/java/com/xhs/pageextractor/MainActivity.java"

          "$BUILD_TOOLS/d8" \
            --lib "$PLATFORM/android.jar" \
            --output "$WORK_DIR" \
            $(find "$WORK_DIR/classes" -name "*.class")

          (cd "$WORK_DIR" && zip -u unaligned.apk classes.dex)

          "$BUILD_TOOLS/zipalign" -f 4 "$WORK_DIR/unaligned.apk" "$WORK_DIR/aligned.apk"

          keytool -genkeypair -v \
            -keystore "$WORK_DIR/release.keystore" \
            -storepass android -alias releasekey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=XHS Page Extractor,O=OpenSource,C=CN"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$WORK_DIR/release.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "xhs-page-extractor.apk" \
            "$WORK_DIR/aligned.apk"

          cp "xhs-page-extractor.apk" "小红书翻页扒图助手.apk"
          ls -lh "小红书翻页扒图助手.apk"

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 小红书翻页扒图助手-Android-APK
          path: |
            小红书翻页扒图助手.apk
            小红书翻页扒图_手机离线版.html

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "📕 小红书翻页视频扒图助手 v1.0.0 (Android APK + 离线单文件版)"
          body: |
            ### 📱 安卓手机端安装说明
            1. 直接下载下方附件中的 **`小红书翻页扒图助手.apk`** 安装到安卓手机即可使用（支持在小红书 App 点击「分享 → 更多 → 用翻页扒图助手提取图片」，以及一键批量写入手机系统相册）。
            2. 或下载 **`小红书翻页扒图_手机离线版.html`**，在任意手机/电脑浏览器直接打开即可离线读取相册视频逐页扒图。
          files: |
            小红书翻页扒图助手.apk
            xhs-page-extractor.apk
            小红书翻页扒图_手机离线版.html
